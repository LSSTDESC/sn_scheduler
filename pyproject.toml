[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sn_scheduler"
version="1.0.0"
requires-python = ">=3.5"
dependencies = ['timezonefinder>=1.0','astropy_healpix']
authors = [
  {name = "Philippe Gris", email = "philippe.gris@clermont.in2p3.fr"},
]
maintainers = [
  {name = "Philippe Gris", email = "philippe.gris@clermont.in2p3.fr"}
]
description = "Scheduler tools"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["Programming Language :: Python",]

[tool.setuptools.packages.find]
where = ["."]
include = ["sn_scheduler","sn_holo_survey"]

[project.urls]
Homepage = "http://github.com/lsstdesc/sn_scheduler"
Repository = "https://github.com/lsstdesc/sn_scheduler"